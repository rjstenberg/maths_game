<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matteäventyret</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script src="modes/multiplication.js" defer></script>
  <script src="modes/addition.js" defer></script>
  <script src="modes/subtraction.js" defer></script>
  <script src="modes/division.js" defer></script>
  <script src="progress.js" defer></script>
  <script src="game.js" defer></script>

</head>


<body>
  <main class="game">

    <!-- Home screen -->
    <section id="homeScreen" class="home-screen">
      <h1>Matteäventyret</h1>
      <p>Välj ditt äventyr!</p>

      <div class="mode-selection">
        <div class="mode-button addition">
          <span class="mode-symbol">+</span>
          <span>Addition</span>

          <div class="difficulty-options">
            <button class="difficulty-button" data-mode="addition" data-difficulty="10">
              <span class="difficulty-symbol">❄️</span>
              <span>Upp till 10</span>
            </button>

            <button class="difficulty-button" data-mode="addition" data-difficulty="20">
              <span class="difficulty-symbol">☃️</span>
              <span>Upp till 20</span>
            </button>
          </div>
        </div>

         <div class="mode-button subtraction">
          <span class="mode-symbol">−</span>
          <span>Subtraktion</span>

          <div class="difficulty-options">
            <button class="difficulty-button" data-mode="subtraction" data-difficulty="10">
              <span class="difficulty-symbol">🍁</span>
              <span>Upp till 10</span>
            </button>

            <button class="difficulty-button" data-mode="subtraction" data-difficulty="20">
              <span class="difficulty-symbol">🍂</span>
              <span>Upp till 20</span>
            </button>
          </div>
        </div>

          <button class="mode-button multiplication" data-mode="multiplication">
            <span class="mode-symbol">×</span>
            <span>Multiplikation</span>
          </button>

          <button class="mode-button division" data-mode="division">
            <span class="mode-symbol">÷</span>
            <span>Division</span>
          </button>
        </div>
      </section>

    <!-- Game screen -->
    <section id="gameScreen" class="game-screen" hidden>
      <button id="homeButton" class="home-button" aria-label="Till startsidan" title="Till startsidan">
        <svg width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="m3 10 9-7 9 7"></path>
          <path d="M5 9v12h14V9"></path>
          <path d="M9 21v-7h6v7"></path>
        </svg>
      </button>

      <div class="map-scroll">
        <section class="map-container" aria-label="Spelkarta">
          <img id="gameMap" src="assets/map.png" alt="Spelkarta">
          <div id="levels"></div>
        </section>
      </div>

      <div class="dev-controls">
        <button
          id="resetProgressButton"
          class="reset-button"
          type="button"
          aria-label="Radera framsteg"
          title="Radera framsteg"
        >
          <svg width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M3 7v6h6"></path>
            <path d="M3 13a9 9 0 1 1 3 6.7"></path>
          </svg>
        </button>
      </div>
      </section>

  </main>
</body>

</html>
